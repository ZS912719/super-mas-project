apiVersion: 1
datasources:
  - name: SuperMAS Observation
    uid: supermas-observation
    type: yesoreyeram-infinity-datasource
    access: proxy
    editable: false
    jsonData:
      auth_method: bearerToken
      allowedHosts:
        - http://127.0.0.1:8091
      timeoutInSeconds: 5
      proxy_type: none
      customHealthCheckEnabled: true
      customHealthCheckUrl: http://127.0.0.1:8091/boards
      allowDangerousHTTPMethods: false
    secureJsonData:
      bearerToken: $SUPERMAS_OBSERVATION_TOKEN
